<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>چارت زنده و خط‌کش موقعیت</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    #topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px; background: #f8f9fa; border-bottom: 1px solid #e0e3eb;
      font-size: 13px; color: #131722; flex-shrink: 0;
    }
    .info-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge-buy {
      background: #1e88e5; color: #fff; padding: 4px 10px;
      border-radius: 5px; font-weight: bold; font-size: 12px;
    }
    .badge-sell {
      background: #c2185b; color: #fff; padding: 4px 10px;
      border-radius: 5px; font-weight: bold; font-size: 12px;
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px; background: #22c55e;
      border-radius: 50%; margin-left: 5px; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    #chart-wrap { position: relative; flex: 1; width: 100%; }
    #chart { width: 100%; height: 100%; }
    #statusMsg {
      position: absolute; top: 12px; right: 16px; z-index: 15;
      background: rgba(255,255,255,0.9); border: 1px solid #d1d4dc;
      padding: 5px 10px; border-radius: 4px; font-size: 11px; color: #434651;
    }
    #fitBtn {
      position: absolute; bottom: 36px; left: 16px; z-index: 10;
      background: #ffffff; border: 1px solid #d1d4dc; color: #131722;
      padding: 5px 10px; border-radius: 4px; font-size: 11px;
      font-family: Tahoma, sans-serif; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    #levelsBar {
      display: flex; gap: 8px; overflow-x: auto; padding: 6px 12px;
      background: #f8f9fa; border-top: 1px solid #e0e3eb;
      font-size: 11px; white-space: nowrap; flex-shrink: 0;
    }
    .lvl-chip {
      padding: 3px 8px; border-radius: 4px; background: #fff;
      border: 1px solid #dce1e7; color: #1e222d;
    }
    .lvl-chip.risk { border-color: #ef5350; color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="info-group">
      <span><span class="live-dot"></span>زنده</span>
      <span>|</span>
      <span>نماد: <strong id="symTitle">---</strong></span>
      <span>|</span>
      <span>تایم‌فریم: <strong id="tfTitle">---</strong></span>
      <span id="pivWrap" style="display:none;">| پیوت: <strong id="pivTitle">---</strong></span>
    </div>
    <div id="dirBadge"></div>
  </div>

  <div id="chart-wrap">
    <div id="statusMsg">در حال دریافت ۲۵۰ کندل زنده...</div>
    <div id="chart"></div>
    <button id="fitBtn" onclick="resetChartZoom()">نمایش ۲۵۰ کندل</button>
  </div>

  <div id="levelsBar"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sym = (params.get('sym') || 'AUDCAD').toUpperCase();
    const tf = (params.get('tf') || 'M15').toUpperCase();
    const dir = (params.get('dir') || 'BUY').toUpperCase();
    const piv = params.get('piv') || '';
    const pivTime = parseInt(params.get('pt') || '0', 10);

    document.title = `${sym} (${tf}) - چارت زنده و خط‌کش`;
    document.getElementById('symTitle').innerText = sym;
    document.getElementById('tfTitle').innerText = tf;
    if (piv) {
      document.getElementById('pivWrap').style.display = 'inline';
      document.getElementById('pivTitle').innerText = piv;
    }

    const isBuy = dir === 'BUY';
    const badge = document.getElementById('dirBadge');
    badge.innerText = isBuy ? 'موقعیت خرید (BUY)' : 'موقعیت فروش (SELL)';
    badge.className = isBuy ? 'badge-buy' : 'badge-sell';

    const container = document.getElementById('chart');
    const chart = LightweightCharts.createChart(container, {
      layout: { background: { color: '#ffffff' }, textColor: '#191919' },
      grid: { vertLines: { visible: false }, horzLines: { visible: false } },
      rightPriceScale: { borderColor: '#d1d4dc', autoScale: true },
      timeScale: { borderColor: '#d1d4dc', timeVisible: true, secondsVisible: false, rightOffset: 35, barSpacing: 4 },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#228b22', downColor: '#dc143c',
      borderVisible: false, wickUpColor: '#228b22', wickDownColor: '#dc143c'
    });

    let precision = 5;
    if (sym.includes('JPY')) precision = 3;
    else if (sym.includes('XAU') || sym.includes('GOLD') || sym.includes('US30') || sym.includes('NAS') || sym.includes('SPX') || sym.includes('OIL')) precision = 2;
    else if (sym.includes('XAG')) precision = 3;

    candleSeries.applyOptions({
      priceFormat: { type: 'price', precision: precision, minMove: Math.pow(10, -precision) }
    });

    const stepColor = isBuy ? '#1e88e5' : '#c2185b';
    const rfColor = '#b8860b';
    const levelsBar = document.getElementById('levelsBar');

    const steps = [];
    for (let i = 1; i <= 7; i++) {
      const val = parseFloat(params.get('s' + i));
      if (!isNaN(val) && val > 0) {
        steps.push({ index: i, price: val });
        const chip = document.createElement('div');
        chip.className = 'lvl-chip';
        chip.innerHTML = `<strong>پله ${i}:</strong> ${val.toFixed(precision)}`;
        levelsBar.appendChild(chip);
      }
    }

    const rfs = [];
    for (let i = 2; i <= 7; i++) {
      const rfVal = parseFloat(params.get('rf' + i));
      if (!isNaN(rfVal) && rfVal > 0) {
        rfs.push({ index: i, price: rfVal });
      }
    }

    const riskVal = parseFloat(params.get('risk'));
    if (!isNaN(riskVal) && riskVal > 0) {
      const rChip = document.createElement('div');
      rChip.className = 'lvl-chip risk';
      rChip.innerHTML = `حد ریسک: ${riskVal.toFixed(precision)}`;
      levelsBar.appendChild(rChip);
    }

    // تبدیل نام نماد و تایم‌فریم به فرمت دیتای زنده بازار
    function mapYahooSymbol(s) {
      if (s === 'XAUUSD') return 'GC=F';
      if (s === 'XAGUSD') return 'SI=F';
      if (s === 'USOIL')  return 'CL=F';
      if (s === 'US30')   return '^DJI';
      if (s === 'NAS100') return '^NDX';
      if (s === 'SPX500') return '^GSPC';
      if (s.length === 6) return s + '=X';
      return s;
    }

    function mapYahooInterval(t) {
      const map = { 'M1': '1m', 'M5': '5m', 'M15': '15m', 'M30': '30m', 'H1': '60m', 'H4': '1h', 'D1': '1d' };
      return map[t] || '15m';
    }

    function getStepSeconds(t) {
      const map = { 'M1': 60, 'M5': 300, 'M15': 900, 'M30': 1800, 'H1': 3600, 'H4': 14400, 'D1': 86400 };
      return map[t] || 900;
    }

    let rulerDrawn = false;
    let totalCandlesCount = 250;

    // رسم خط‌کش کوتاه و دقیق شبیه عکس متاتریدر (از پیوت تا ۴۵ کندل جلوتر)
    function drawMT5StyleRuler(candles) {
      if (rulerDrawn || candles.length === 0) return;
      rulerDrawn = true;

      const tfSec = getStepSeconds(tf);
      const lastTime = candles[candles.length - 1].time;
      let startTime = pivTime > 0 ? pivTime : candles[Math.max(0, candles.length - 15)].time;
      if (startTime > lastTime) startTime = candles[Math.max(0, candles.length - 10)].time;
      const endTime = startTime + (45 * tfSec);

      // رسم خطوط کوتاه پله‌ها
      steps.forEach(st => {
        const line = chart.addLineSeries({
          color: stepColor,
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid,
          lastValueVisible: true,
          priceLineVisible: false,
          title: 'پله ' + st.index
        });
        line.setData([
          { time: startTime, value: st.price },
          { time: endTime, value: st.price }
        ]);
      });

      // رسم خطوط خط‌چین ریسک‌فری
      rfs.forEach(rf => {
        const line = chart.addLineSeries({
          color: rfColor,
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          lastValueVisible: true,
          priceLineVisible: false,
          title: 'RF ' + rf.index
        });
        line.setData([
          { time: startTime, value: rf.price },
          { time: endTime, value: rf.price }
        ]);
      });
    }

    function resetChartZoom() {
      const fromIdx = Math.max(0, totalCandlesCount - 250);
      chart.timeScale().setVisibleLogicalRange({ from: fromIdx, to: totalCandlesCount + 45 });
    }

    async function fetchLiveCandles(isFirstLoad) {
      const ySym = encodeURIComponent(mapYahooSymbol(sym));
      const yInt = mapYahooInterval(tf);
      const range = (tf === 'M1') ? '1d' : (tf === 'M5' || tf === 'M15' ? '5d' : '1mo');
      const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}?interval=${yInt}&range=${range}`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        const data = await res.json();
        const result = data.chart.result[0];
        const timestamps = result.timestamp;
        const quote = result.indicators.quote[0];

        const candles = [];
        for (let i = 0; i < timestamps.length; i++) {
          if (quote.open[i] !== null && quote.close[i] !== null) {
            candles.push({
              time: timestamps[i],
              open: quote.open[i],
              high: quote.high[i],
              low: quote.low[i],
              close: quote.close[i]
            });
          }
        }

        const last250 = candles.slice(-250);
        if (last250.length > 0) {
          totalCandlesCount = last250.length;
          candleSeries.setData(last250);
          document.getElementById('statusMsg').style.display = 'none';

          if (isFirstLoad) {
            drawMT5StyleRuler(last250);
            resetChartZoom();
          }
        }
      } catch (e) {
        document.getElementById('statusMsg').innerText = 'در حال تلاش مجدد برای اتصال به دیتای زنده...';
      }
    }

    fetchLiveCandles(true);
    setInterval(() => fetchLiveCandles(false), 5000);

    window.addEventListener('resize', () => {
      chart.resize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
