<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>چارت زنده و خط‌کش موقعیت</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    #topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px; background: #f8f9fa; border-bottom: 1px solid #e0e3eb;
      font-size: 13px; color: #131722; flex-shrink: 0;
    }
    .info-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge-buy {
      background: #1e88e5; color: #fff; padding: 4px 10px;
      border-radius: 5px; font-weight: bold; font-size: 12px;
    }
    .badge-sell {
      background: #c2185b; color: #fff; padding: 4px 10px;
      border-radius: 5px; font-weight: bold; font-size: 12px;
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px; background: #22c55e;
      border-radius: 50%; margin-left: 5px; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    #chart-wrap { position: relative; flex: 1; width: 100%; }
    #chart { width: 100%; height: 100%; }
    #statusMsg {
      position: absolute; top: 12px; right: 16px; z-index: 15;
      background: rgba(255,255,255,0.95); border: 1px solid #d1d4dc;
      padding: 6px 12px; border-radius: 5px; font-size: 12px; color: #131722;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    #fitBtn {
      position: absolute; bottom: 36px; left: 16px; z-index: 10;
      background: #ffffff; border: 1px solid #d1d4dc; color: #131722;
      padding: 6px 12px; border-radius: 4px; font-size: 11px;
      font-family: Tahoma, sans-serif; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    #levelsBar {
      display: flex; gap: 8px; overflow-x: auto; padding: 7px 12px;
      background: #f8f9fa; border-top: 1px solid #e0e3eb;
      font-size: 11px; white-space: nowrap; flex-shrink: 0;
    }
    .lvl-chip {
      padding: 4px 9px; border-radius: 4px; background: #fff;
      border: 1px solid #dce1e7; color: #1e222d;
    }
    .lvl-chip.rf { border-color: #d4a017; color: #8a6400; }
    .lvl-chip.risk { border-color: #ef5350; color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="info-group">
      <span><span class="live-dot"></span>زنده</span>
      <span>|</span>
      <span>نماد: <strong id="symTitle">---</strong></span>
      <span>|</span>
      <span>تایم‌فریم: <strong id="tfTitle">---</strong></span>
      <span id="pivWrap" style="display:none;">| پیوت: <strong id="pivTitle">---</strong></span>
    </div>
    <div id="dirBadge"></div>
  </div>

  <div id="chart-wrap">
    <div id="statusMsg">در حال بارگذاری سریع چارت...</div>
    <div id="chart"></div>
    <button id="fitBtn" onclick="resetChartZoom()">نمایش ۲۵۰ کندل</button>
  </div>

  <div id="levelsBar"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sym = (params.get('sym') || 'AUDCAD').toUpperCase();
    const tf = (params.get('tf') || 'M15').toUpperCase();
    const dir = (params.get('dir') || 'BUY').toUpperCase();
    const piv = params.get('piv') || '';

    document.title = `${sym} (${tf}) - چارت زنده و خط‌کش`;
    document.getElementById('symTitle').innerText = sym;
    document.getElementById('tfTitle').innerText = tf;
    if (piv) {
      document.getElementById('pivWrap').style.display = 'inline';
      document.getElementById('pivTitle').innerText = piv;
    }

    const isBuy = dir === 'BUY';
    const badge = document.getElementById('dirBadge');
    badge.innerText = isBuy ? 'موقعیت خرید (BUY)' : 'موقعیت فروش (SELL)';
    badge.className = isBuy ? 'badge-buy' : 'badge-sell';

    const container = document.getElementById('chart');
    const chart = LightweightCharts.createChart(container, {
      layout: { background: { color: '#ffffff' }, textColor: '#131722' },
      grid: { vertLines: { color: '#f3f5f9' }, horzLines: { color: '#f3f5f9' } },
      rightPriceScale: { borderColor: '#d1d4dc', autoScale: true, scaleMargins: { top: 0.06, bottom: 0.06 } },
      timeScale: { borderColor: '#d1d4dc', timeVisible: true, secondsVisible: false, rightOffset: 25, barSpacing: 4.5 },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#228b22', downColor: '#dc143c',
      borderUpColor: '#228b22', borderDownColor: '#dc143c',
      wickUpColor: '#228b22', wickDownColor: '#dc143c'
    });

    let precision = 5;
    if (sym.includes('JPY')) precision = 3;
    else if (sym.includes('XAU') || sym.includes('GOLD') || sym.includes('US30') || sym.includes('NAS') || sym.includes('SPX') || sym.includes('OIL')) precision = 2;
    else if (sym.includes('XAG')) precision = 3;

    candleSeries.applyOptions({
      priceFormat: { type: 'price', precision: precision, minMove: Math.pow(10, -precision) }
    });

    const stepColor = isBuy ? '#1e88e5' : '#c2185b';
    const rfColor = '#b8860b';
    const levelsBar = document.getElementById('levelsBar');

    // رسم قطعی و تضمینی خط‌کش روی چارت (پله ۱ تا ۷)
    const allPrices = [];
    for (let i = 1; i <= 7; i++) {
      const val = parseFloat(params.get('s' + i));
      if (!isNaN(val) && val > 0) {
        allPrices.push(val);
        candleSeries.createPriceLine({
          price: val,
          color: stepColor,
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title: `پله ${i}`
        });

        const chip = document.createElement('div');
        chip.className = 'lvl-chip';
        chip.innerHTML = `<strong>پله ${i}:</strong> ${val.toFixed(precision)}`;
        levelsBar.appendChild(chip);
      }
    }

    // رسم قطعی خطوط تی‌پی / ریسک‌فری (RF 2 تا RF 7)
    for (let i = 2; i <= 7; i++) {
      const rfVal = parseFloat(params.get('rf' + i));
      if (!isNaN(rfVal) && rfVal > 0) {
        allPrices.push(rfVal);
        candleSeries.createPriceLine({
          price: rfVal,
          color: rfColor,
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: `تی‌پی / RF ${i}`
        });

        const rfChip = document.createElement('div');
        rfChip.className = 'lvl-chip rf';
        rfChip.innerHTML = `<strong>تی‌پی / RF ${i}:</strong> ${rfVal.toFixed(precision)}`;
        levelsBar.appendChild(rfChip);
      }
    }

    // رسم خط حد ریسک
    const riskVal = parseFloat(params.get('risk'));
    if (!isNaN(riskVal) && riskVal > 0) {
      candleSeries.createPriceLine({
        price: riskVal,
        color: '#d32f2f',
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.LargeDashed,
        axisLabelVisible: true,
        title: 'حد ریسک'
      });

      const rChip = document.createElement('div');
      rChip.className = 'lvl-chip risk';
      rChip.innerHTML = `حد ریسک: ${riskVal.toFixed(precision)}`;
      levelsBar.appendChild(rChip);
    }

    // تنظیم مقیاس عمودی چارت طوری که پله‌ها همیشه داخل کادر دیده شوند
    if (allPrices.length > 0) {
      const minStep = Math.min(...allPrices);
      const maxStep = Math.max(...allPrices);
      candleSeries.applyOptions({
        autoscaleInfoProvider: original => {
          const res = original();
          if (res !== null) {
            res.priceRange.minValue = Math.min(res.priceRange.minValue, minStep);
            res.priceRange.maxValue = Math.max(res.priceRange.maxValue, maxStep);
          }
          return res;
        }
      });
    }

    // تبدیل نماد و تایم‌فریم برای دریافت سریع دیتای کندلی
    function getBinanceOrYahooConfig(s, t) {
      const yMap = { 'M1': '1m', 'M5': '5m', 'M15': '15m', 'M30': '30m', 'H1': '60m', 'H4': '1h', 'D1': '1d' };
      let ySym = s.length === 6 ? s + '=X' : s;
      if (s === 'XAUUSD') ySym = 'GC=F';
      else if (s === 'XAGUSD') ySym = 'SI=F';
      else if (s === 'USOIL') ySym = 'CL=F';
      else if (s === 'US30') ySym = '^DJI';
      else if (s === 'NAS100') ySym = '^NDX';
      else if (s === 'SPX500') ySym = '^GSPC';
      return { ySym, yInt: yMap[t] || '15m' };
    }

    let totalCandlesCount = 250;

    function resetChartZoom() {
      const fromIdx = Math.max(0, totalCandlesCount - 250);
      chart.timeScale().setVisibleLogicalRange({ from: fromIdx, to: totalCandlesCount + 20 });
    }

    async function fetchFastCandles(isFirst) {
      const cfg = getBinanceOrYahooConfig(sym, tf);
      const range = (tf === 'M1') ? '1d' : (tf === 'M5' || tf === 'M15' ? '5d' : '1mo');
      const rawUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(cfg.ySym)}?interval=${cfg.yInt}&range=${range}&_=${Date.now()}`;

      const proxies = [
        `https://corsproxy.io/?url=${encodeURIComponent(rawUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rawUrl)}`,
        `https://thingproxy.freeboard.io/fetch/${rawUrl}`
      ];

      try {
        const res = await Promise.any(proxies.map(u => fetch(u).then(r => {
          if (!r.ok) throw new Error('err');
          return r.json();
        })));

        const result = res.chart.result[0];
        const ts = result.timestamp;
        const q = result.indicators.quote[0];
        const candles = [];

        for (let i = 0; i < ts.length; i++) {
          if (q.open[i] !== null && q.close[i] !== null) {
            candles.push({
              time: ts[i],
              open: q.open[i],
              high: q.high[i],
              low: q.low[i],
              close: q.close[i]
            });
          }
        }

        const last250 = candles.slice(-250);
        if (last250.length > 0) {
          totalCandlesCount = last250.length;
          candleSeries.setData(last250);
          document.getElementById('statusMsg').style.display = 'none';
          if (isFirst) resetChartZoom();
        }
      } catch (e) {
        if (isFirst) {
          document.getElementById('statusMsg').innerText = 'در حال همگام‌سازی کندل‌ها...';
        }
      }
    }

    fetchFastCandles(true);
    setInterval(() => fetchFastCandles(false), 4000);

    window.addEventListener('resize', () => {
      chart.resize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
