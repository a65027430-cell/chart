<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>چارت زنده تردینگ‌ویو + خط‌کش موقعیت</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    #topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 14px; background: #1e222d; color: #ffffff;
      font-size: 13px; flex-shrink: 0;
    }
    .info-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge-buy {
      background: #1e88e5; color: #fff; padding: 4px 10px;
      border-radius: 5px; font-weight: bold; font-size: 12px;
    }
    .badge-sell {
      background: #c2185b; color: #fff; padding: 4px 10px;
      border-radius: 5px; font-weight: bold; font-size: 12px;
    }
    #workspace {
      display: flex; flex: 1; width: 100%; height: calc(100vh - 40px); overflow: hidden;
    }
    #tv-container {
      flex: 1; height: 100%;
    }
    #ruler-sidebar {
      width: 290px; background: #f8f9fa; border-right: 2px solid #d1d4dc;
      display: flex; flex-direction: column; overflow-y: auto; padding: 10px;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 13px; font-weight: bold; color: #131722;
      padding-bottom: 8px; border-bottom: 1px solid #d1d4dc; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .ruler-visual {
      background: #ffffff; border: 1px solid #d1d4dc; border-radius: 6px; padding: 8px;
    }
    .r-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 8px; margin: 4px 0; border-radius: 4px; font-size: 12px;
      cursor: pointer;
    }
    .r-step-buy { border-right: 4px solid #1e88e5; background: #eef6ff; color: #0d47a1; }
    .r-step-sell { border-right: 4px solid #c2185b; background: #fceef5; color: #880e4f; }
    .r-rf { border-right: 4px dashed #b8860b; background: #fffbeb; color: #785500; font-size: 11px; }
    .r-risk { border-right: 4px solid #d32f2f; background: #ffebee; color: #b71c1c; font-weight: bold; }
    .copy-tag { font-size: 10px; background: rgba(0,0,0,0.08); padding: 2px 5px; border-radius: 3px; }
    @media (max-width: 768px) {
      #workspace { flex-direction: column; }
      #ruler-sidebar { width: 100%; height: 40%; border-right: none; border-top: 2px solid #d1d4dc; }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="info-group">
      <span>نماد: <strong id="symTitle">---</strong></span>
      <span>|</span>
      <span>تایم‌فریم: <strong id="tfTitle">---</strong></span>
      <span id="pivWrap" style="display:none;">| پیوت: <strong id="pivTitle">---</strong></span>
    </div>
    <div id="dirBadge"></div>
  </div>

  <div id="workspace">
    <div id="tv-container"></div>
    <div id="ruler-sidebar">
      <div class="sidebar-title">
        <span>پله‌ها و ریسک‌فری</span>
        <span id="copyStatus" style="font-size:11px; color:#228b22;"></span>
      </div>
      <div id="rulerList" class="ruler-visual"></div>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sym = (params.get('sym') || 'AUDCAD').toUpperCase();
    const tf = (params.get('tf') || 'M15').toUpperCase();
    const dir = (params.get('dir') || 'BUY').toUpperCase();
    const piv = params.get('piv') || '';

    document.title = `${sym} (${tf}) - چارت زنده`;
    document.getElementById('symTitle').innerText = sym;
    document.getElementById('tfTitle').innerText = tf;
    if (piv) {
      document.getElementById('pivWrap').style.display = 'inline';
      document.getElementById('pivTitle').innerText = piv;
    }

    const isBuy = dir === 'BUY';
    const badge = document.getElementById('dirBadge');
    badge.innerText = isBuy ? 'خرید (BUY)' : 'فروش (SELL)';
    badge.className = isBuy ? 'badge-buy' : 'badge-sell';

    function mapTVSymbol(s) {
      if (s === 'XAUUSD') return 'OANDA:XAUUSD';
      if (s === 'XAGUSD') return 'OANDA:XAGUSD';
      if (s === 'USOIL')  return 'TVC:USOIL';
      if (s === 'US30')   return 'FOREXCOM:DJI';
      if (s === 'NAS100') return 'FOREXCOM:NSXUSD';
      if (s === 'SPX500') return 'FOREXCOM:SPXUSD';
      if (s.length === 6) return 'FX:' + s;
      return s;
    }

    function mapTVInterval(t) {
      const m = { 'M1': '1', 'M5': '5', 'M15': '15', 'M30': '30', 'H1': '60', 'H4': '240', 'D1': 'D' };
      return m[t] || '15';
    }

    new TradingView.widget({
      "autosize": true,
      "symbol": mapTVSymbol(sym),
      "interval": mapTVInterval(tf),
      "timezone": "Etc/UTC",
      "theme": "light",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "allow_symbol_change": true,
      "container_id": "tv-container"
    });

    let precision = 5;
    if (sym.includes('JPY')) precision = 3;
    else if (sym.includes('XAU') || sym.includes('GOLD') || sym.includes('US30') || sym.includes('NAS') || sym.includes('SPX') || sym.includes('OIL')) precision = 2;
    else if (sym.includes('XAG')) precision = 3;

    const rulerList = document.getElementById('rulerList');
    const items = [];
    for (let i = 1; i <= 7; i++) {
      const val = parseFloat(params.get('s' + i));
      if (!isNaN(val) && val > 0) items.push({ type: 'step', label: `پله ${i}`, price: val });
    }
    for (let i = 2; i <= 7; i++) {
      const rfVal = parseFloat(params.get('rf' + i));
      if (!isNaN(rfVal) && rfVal > 0) items.push({ type: 'rf', label: `تی‌پی / RF ${i}`, price: rfVal });
    }
    const riskVal = parseFloat(params.get('risk'));
    if (!isNaN(riskVal) && riskVal > 0) items.push({ type: 'risk', label: 'حد ریسک', price: riskVal });

    items.sort((a, b) => b.price - a.price);

    function copyPrice(valStr) {
      navigator.clipboard.writeText(valStr);
      const st = document.getElementById('copyStatus');
      st.innerText = 'کپی شد!';
      setTimeout(() => { st.innerText = ''; }, 1200);
    }

    items.forEach(it => {
      const row = document.createElement('div');
      let cls = 'r-line ' + (it.type === 'step' ? (isBuy ? 'r-step-buy' : 'r-step-sell') : (it.type === 'rf' ? 'r-rf' : 'r-risk'));
      const pStr = it.price.toFixed(precision);
      row.className = cls;
      row.onclick = () => copyPrice(pStr);
      row.innerHTML = `<span><strong>${it.label}</strong></span><span><code>${pStr}</code> <span class="copy-tag">کپی</span></span>`;
      rulerList.appendChild(row);
    });
  </script>
</body>
</html>
